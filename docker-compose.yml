services:
  mariadb:
    image: mariadb:11.4
    container_name: l2-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-luiz33423342}
      MYSQL_DATABASE: ${DB_NAME:-l2jmobiusinterlude}
    volumes:
      - l2_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - l2-network

  loginserver:
    image: eclipse-temurin:25-jdk
    container_name: l2-loginserver
    restart: unless-stopped
    environment:
      SERVER_TYPE: login
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-l2jmobiusinterlude}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-luiz33423342}
      JAVA_XMS: 128m
      JAVA_XMX: 512m
    ports:
      - "2106:2106"
    volumes:
      - l2_app_data:/app
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - l2-network
    command:
      - /bin/bash
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq git netcat-traditional dos2unix mariadb-client > /dev/null
        if [ ! -d "/app/dist" ]; then
          git clone --depth 1 https://github.com/NETOLUIZ/l2morbius.git /app
        else
          cd /app && git fetch origin && git reset --hard origin/main
        fi
        dos2unix /app/docker/entrypoint.sh
        chmod +x /app/docker/entrypoint.sh
        exec /app/docker/entrypoint.sh

  gameserver:
    image: eclipse-temurin:25-jdk
    container_name: l2-gameserver
    restart: unless-stopped
    environment:
      SERVER_TYPE: game
      EXTERNAL_IP: ${EXTERNAL_IP:-2.24.108.110}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-l2jmobiusinterlude}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-luiz33423342}
      LOGIN_HOST: loginserver
      LOGIN_PORT: 9014
      PACKET_ENCRYPTION: "True"
      JAVA_XMS: 2g
      JAVA_XMX: 4g
    ports:
      - "7777:7777"
    volumes:
      - l2_app_data:/app
    depends_on:
      mariadb:
        condition: service_healthy
      loginserver:
        condition: service_started
    networks:
      - l2-network
    command:
      - /bin/bash
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq git netcat-traditional dos2unix mariadb-client > /dev/null
        while [ ! -d "/app/dist" ]; do
          sleep 2
        done
        cd /app && git fetch origin && git reset --hard origin/main || true
        dos2unix /app/docker/entrypoint.sh
        chmod +x /app/docker/entrypoint.sh
        exec /app/docker/entrypoint.sh

  web:
    image: php:8.2-apache
    container_name: l2-website
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-l2jmobiusinterlude}
      DB_USER: root
      DB_PASS: ${DB_PASSWORD:-luiz33423342}
      SERVER_IP: ${EXTERNAL_IP:-2.24.108.110}
      LOGIN_PORT: "2106"
      GAME_PORT: "7777"
    ports:
      - "8090:80"
    volumes:
      - l2_app_data:/app
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - l2-network
    command:
      - /bin/bash
      - -c
      - |
        docker-php-ext-install mysqli pdo pdo_mysql > /dev/null
        while [ ! -d "/app/site" ]; do
          sleep 2
        done
        rm -rf /var/www/html/*
        cp -r /app/site/. /var/www/html/
        chown -R www-data:www-data /var/www/html
        exec apache2-foreground


volumes:
  l2_db_data:
  l2_app_data:

networks:
  l2-network:
    driver: bridge
