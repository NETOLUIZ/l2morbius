# ---------------------------------------------------------------------------
# SmartBot System Configuration (AI Companions & Fake Players)
# ---------------------------------------------------------------------------

# Enable or disable the SmartBot Companion System.
# Default: True
EnableSmartBot = True

# NPC ID of the SmartBot Companion Master.
# Default: 50020
SmartBotNpcId = 50020

# Maximum number of active bots allowed per player.
# Default: 3
MaxBotsPerPlayer = 3

# Currency Item ID to purchase / create a bot (Donation Coin).
# Default: 4037 (Coin of Luck)
BotDonationCoinId = 4037

# Quantity of the coin required to create each bot.
# Set to 0 for free/test mode.
# Default: 0
BotDonationCoinCount = 0

# Starting level for newly created player companion bots.
# Default: 20
BotStartingLevel = 20

# Distance within which the bot follows its master.
# Default: 150
BotFollowDistance = 150

# Radius to search for aggressive targets or assist attacks.
# Default: 900
BotAttackSearchRadius = 900

# Radius for Healer bots to cast heals on low-HP party members.
# Default: 900
BotHealRange = 900

# Health percentage threshold to trigger heals.
# Default: 85.0
BotHealHpPercent = 85.0

# Mana Potion Item ID used by bots when MP is low.
# Default: 728 (Mana Potion)
BotManaPotionItemId = 728

# Bot Mana Potion count added to inventory.
# Default: 100
BotManaPotionCount = 100

# Mana percentage threshold to use mana potion.
# Default: 35.0
BotManaPotionMpPercent = 35.0

# Chat listening radius for local player commands and chat.
# Default: 1250
BotChatRadius = 1250

# Maximum characters allowed in bot chat responses.
# Default: 100
BotMaxReplyChars = 100

# Maximum words allowed in bot chat responses.
# Default: 15
BotMaxReplyWords = 15

# Cooldown between chat replies in milliseconds.
# Default: 2500
BotReplyCooldownMs = 2500

# History lines stored in short-term memory per bot.
# Default: 10
BotMemoryLines = 10

# Number of game knowledge facts injected into the AI context.
# Default: 4
BotKnowledgeFacts = 4

# Ollama API URL for local LLM text generation.
# Default: http://127.0.0.1:11434/api/generate
BotOllamaUrl = http://127.0.0.1:11434/api/generate

# Ollama model name (e.g., gemma3, llama3, mistral).
# Default: gemma3
BotOllamaModel = gemma3
